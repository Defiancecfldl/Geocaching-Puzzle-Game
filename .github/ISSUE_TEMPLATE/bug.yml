name: 缺陷报告
description: 记录可稳定复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: 设备、Android 版本、应用版本、网络状态。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果和日志
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - S1 阻塞演示或数据损坏
        - S2 核心流程不可用
        - S3 有替代路径
        - S4 轻微体验问题
    validations:
      required: true
